services:
  ms-usuarios:
    image: joseave/ms-clientes:latest
    container_name: ms-clientes
    ports:
      - "8083:8083"

  ms-catalogo:
    image: joseave/wepay-catalogo:latest
    container_name: ms-catalogo
    ports:
      - "8084:8084"

  ms-pedidos:
    image: joseave/wepay-ms-pedidos:latest
    container_name: ms-pedidos
    ports:
      - "8085:8085"

  api-bff:
    image: joseave/wepay-bff:latest
    container_name: api-bff
    ports:
      - "8081:8081"
    environment:
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI}
      - ENTRA_API_CLIENT_ID=${ENTRA_API_CLIENT_ID}
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      - MS_USUARIOS_URL=http://ms-usuarios:8083
      - MS_PRODUCTOS_URL=http://ms-catalogo:8084
      - MS_PEDIDOS_URL=http://ms-pedidos:8085
    depends_on:
      - ms-usuarios
      - ms-catalogo
      - ms-pedidos

  frontend:
    image: joseave/wepay-frontend:latest
    container_name: frontend
    ports:
      - "5173:80"
    environment:
      - VITE_ENTRA_TENANT_ID=${VITE_ENTRA_TENANT_ID}
      - VITE_SPA_CLIENT_ID=${VITE_SPA_CLIENT_ID}
      - VITE_API_CLIENT_ID=${VITE_API_CLIENT_ID}
      - VITE_BFF_BASE_URL=${VITE_BFF_BASE_URL}
    depends_on:
      - api-bff